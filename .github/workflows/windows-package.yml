name: Windows installer (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/windows/runtime-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r packaging/windows/build-requirements.txt
      - name: Regression checks (synthetic data only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 --yes --no-progress --allow-downgrade --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        run: python packaging/windows/build.py
      - name: Artifact hashes
        shell: pwsh
        run: Get-FileHash dist/installer/*.exe -Algorithm SHA256 | Format-List | Out-File dist/installer/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RSQCompare-Windows-installer
          path: dist/installer/
          if-no-files-found: error
          retention-days: 14
